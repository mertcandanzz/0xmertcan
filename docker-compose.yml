# Local PostgreSQL for development. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oxm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oxm_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-oxmertcan}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-oxm}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
